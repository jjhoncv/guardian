# release-please mantiene el PR de release (CHANGELOG + versión). Al hacer merge se crea el release
# y producción se despliega solo tras la aprobación del Environment `production`.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Uno a la vez: release-please lee el main actual y dos merges seguidos se pisarían.
    concurrency:
      group: release-please
      cancel-in-progress: false
    timeout-minutes: 5
    outputs:
      creado: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # Proyecto recién creado: sin el PAT, release-please espera en vez de fallar.
      - id: token
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: echo "hay=$([ -n "$TOKEN" ] && echo si || echo no)" >> "$GITHUB_OUTPUT"
      # PAT fine-grained (ADR 0011): los PRs creados con GITHUB_TOKEN no disparan el CI.
      - id: release
        if: steps.token.outputs.hay == 'si'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  build:
    needs: release-please
    if: needs.release-please.outputs.creado == 'true'
    uses: ./.github/workflows/build-netlify.yml
    with:
      # Producción compila exactamente el tag del release, no el commit que disparó este run.
      ref: ${{ needs.release-please.outputs.tag }}

  produccion:
    name: deploy a producción
    needs: [release-please, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: produccion
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sitio
      - id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          npx -y netlify-cli@27.10.2 deploy --no-build --dir .netlify/static --prod --message "$TAG" --json > deploy.json
          jq . deploy.json
          echo "url=$(jq -r .url deploy.json)" >> "$GITHUB_OUTPUT"
