# Build para Netlify sin secretos (el código del repo no corre con tokens). Lo usan Deploy y Release.
name: Build Netlify

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, rama o tag a compilar (por defecto, el del evento).
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: build para Netlify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # netlify-cli fijado y fuera de package.json (#26): Dependabot no lo actualiza; súbelo junto con deploy.yml y release.yml.
      - run: npx -y netlify-cli@27.10.2 build --offline
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sitio
          include-hidden-files: true
          retention-days: 1
          path: |
            netlify.toml
            .netlify
            !.netlify/plugins
