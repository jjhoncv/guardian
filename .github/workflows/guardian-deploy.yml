# Guardián · Deploy reutilizable: preview por PR (pr-N) y staging en main, en el sitio de Netlify del proyecto
# (ADR 0008). El build (código del proyecto) corre sin secretos; el deploy usa el token y no ejecuta código del repo.
name: Guardián · Deploy

on:
  workflow_call:
    inputs:
      base_de_datos:
        description: "«mysql» aplica db/migraciones/ antes de publicar (ADR 0029)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: build para Netlify
    # Sin NETLIFY_SITE_ID no hay a dónde desplegar. Forks y Dependabot no tienen acceso a los secretos.
    if: >-
      vars.NETLIFY_SITE_ID != '' && (
        github.event_name == 'push' ||
        (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # netlify-cli fijado por lockfile (#73), de una versión confiable del Guardián; se instala fuera del proyecto.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ (job.workflow_repository == github.repository && github.event.pull_request.base.sha) || job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: tools/netlify
          path: .guardian
      - run: mv .guardian/tools/netlify "$RUNNER_TEMP/netlify" && rm -rf .guardian && npm ci --prefix "$RUNNER_TEMP/netlify"
      - run: '"$RUNNER_TEMP/netlify/node_modules/.bin/netlify" build --offline'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sitio
          include-hidden-files: true
          retention-days: 1
          # netlify/functions: `netlify deploy --no-build` vuelve a empaquetar las funciones del proyecto desde ahí
          # (#216). Solo se empaquetan; el deploy no ejecuta código del repo.
          path: |
            netlify.toml
            .netlify
            !.netlify/plugins
            netlify/functions
            !netlify/functions/**/*.test.ts

  deploy:
    name: deploy a Netlify
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # netlify-cli fijado por lockfile (#73), de una versión confiable del Guardián; se instala fuera del proyecto.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ (job.workflow_repository == github.repository && github.event.pull_request.base.sha) || job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: tools/netlify
          path: .guardian
      - run: mv .guardian/tools/netlify "$RUNNER_TEMP/netlify" && rm -rf .guardian && npm ci --prefix "$RUNNER_TEMP/netlify"
      # Migraciones del proyecto (ADR 0029) antes de publicar: el SQL de db/migraciones/ y la herramienta de esta
      # versión del Guardián; la conexión sale de los secretos del Environment `staging`. No corre código del proyecto.
      - if: inputs.base_de_datos == 'mysql' && github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: db/migraciones
          path: .proyecto-db
      - if: inputs.base_de_datos == 'mysql' && github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ (job.workflow_repository == github.repository && github.event.pull_request.base.sha) || job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/db
            scripts/migraciones.ts
          path: .guardian-db
      - if: inputs.base_de_datos == 'mysql' && github.event_name == 'push'
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_SSL: ${{ vars.MYSQL_SSL || '1' }}
        run: |
          if [ -z "$MYSQL_HOST" ]; then
            echo "::error::Faltan los secretos MYSQL_* del Environment staging (Settings → Environments → staging)."; exit 1
          fi
          npm ci --prefix .guardian-db/tools/db --ignore-scripts
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .guardian-db/tools/db/migrar.ts .proyecto-db/db/migraciones
          rm -rf .guardian-db .proyecto-db
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sitio
      - id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          ALIAS: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'staging' }}
          SHA: ${{ github.sha }}
        run: |
          "$RUNNER_TEMP/netlify/node_modules/.bin/netlify" deploy --no-build --dir .netlify/static --alias "$ALIAS" \
            --message "$ALIAS $SHA" --json > deploy.json
          jq . deploy.json
          echo "url=$(jq -r .deploy_url deploy.json)" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment ${{ github.event.number }} --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "**Preview:** $URL (commit \`${SHA::7}\`)"
