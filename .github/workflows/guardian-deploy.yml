# Guardián · Deploy reutilizable: preview por PR (pr-N) y staging en main, en el sitio de Netlify del proyecto
# (ADR 0008). Con base_de_datos: mysql, cada preview tiene su propia base (#282); el llamador del proyecto
# escucha también pull_request «closed» para borrarla. El build (código del proyecto) corre sin secretos; el deploy usa el token y no ejecuta código del repo.
name: Guardián · Deploy

on:
  workflow_call:
    inputs:
      base_de_datos:
        description: "«mysql» aplica db/migraciones/ antes de publicar (ADR 0029)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Base propia por PR (#282): <repo>_pr_<N> en el cluster de staging, vacía y migrada con el SQL del PR en cada
  # deploy. Usa el usuario «preview» del Environment `preview`, que solo puede tocar bases <repo>_pr_*. Sin esos
  # secretos, el preview sigue con la base de staging. No corre código del proyecto: solo su SQL.
  base_preview:
    name: base del preview
    if: >-
      inputs.base_de_datos == 'mysql' && vars.NETLIFY_SITE_ID != '' &&
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    outputs:
      nombre: ${{ steps.base.outputs.nombre }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: db/migraciones
          path: .proyecto-db
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ (job.workflow_repository == github.repository && github.event.pull_request.base.sha) || job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/db
            scripts/migraciones.ts
            scripts/base-preview.ts
          path: .guardian-db
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: base
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_SSL: ${{ vars.MYSQL_SSL || '1' }}
          PR: ${{ github.event.number }}
        run: |
          if [ -z "$MYSQL_HOST" ]; then
            echo "::notice::El Environment preview no tiene MYSQL_*: este preview usa la base de staging (sus tablas nuevas no existen ahí)."
            exit 0
          fi
          nombre=$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --input-type=module -e \
            "import { nombreBasePreview } from './.guardian-db/scripts/base-preview.ts'; console.log(nombreBasePreview(process.env.GITHUB_REPOSITORY, process.env.PR))")
          npm ci --prefix .guardian-db/tools/db --ignore-scripts
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .guardian-db/tools/db/base-preview.ts crear "$nombre"
          if ls .proyecto-db/db/migraciones/*.sql >/dev/null 2>&1; then
            MYSQL_DATABASE="$nombre" node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .guardian-db/tools/db/migrar.ts .proyecto-db/db/migraciones
          fi
          echo "nombre=$nombre" >> "$GITHUB_OUTPUT"

  # Al cerrar el PR (fusionado o no), su base de preview se borra.
  borrar_base_preview:
    name: borrar la base del preview
    if: >-
      inputs.base_de_datos == 'mysql' && github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/db
            scripts/base-preview.ts
          path: .guardian-db
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_SSL: ${{ vars.MYSQL_SSL || '1' }}
          PR: ${{ github.event.number }}
        run: |
          [ -n "$MYSQL_HOST" ] || { echo "Sin base de preview: nada que borrar."; exit 0; }
          nombre=$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --input-type=module -e \
            "import { nombreBasePreview } from './.guardian-db/scripts/base-preview.ts'; console.log(nombreBasePreview(process.env.GITHUB_REPOSITORY, process.env.PR))")
          npm ci --prefix .guardian-db/tools/db --ignore-scripts
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .guardian-db/tools/db/base-preview.ts borrar "$nombre"

  build:
    name: build para Netlify
    needs: base_preview
    # Sin NETLIFY_SITE_ID no hay a dónde desplegar. Forks y Dependabot no tienen acceso a los secretos.
    # Corre aunque base_preview se salte (push a main, o sin base de datos); no si falló.
    if: >-
      !cancelled() && needs.base_preview.result != 'failure' &&
      vars.NETLIFY_SITE_ID != '' && github.event.action != 'closed' && (
        github.event_name == 'push' ||
        (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Solo el nombre de la base del PR (no es secreto): el proyecto lo deja fijo en el build del preview
      # (next.config → env). Vacío en staging y producción.
      MYSQL_DATABASE_PREVIEW: ${{ needs.base_preview.outputs.nombre }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # netlify-cli fijado por lockfile (#73), de una versión confiable del Guardián; se instala fuera del proyecto.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ (job.workflow_repository == github.repository && github.event.pull_request.base.sha) || job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: tools/netlify
          path: .guardian
      - run: mv .guardian/tools/netlify "$RUNNER_TEMP/netlify" && rm -rf .guardian && npm ci --prefix "$RUNNER_TEMP/netlify"
      - run: '"$RUNNER_TEMP/netlify/node_modules/.bin/netlify" build --offline'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sitio
          include-hidden-files: true
          retention-days: 1
          # netlify/functions: `netlify deploy --no-build` vuelve a empaquetar las funciones del proyecto desde ahí
          # (#216). Solo se empaquetan; el deploy no ejecuta código del repo.
          path: |
            netlify.toml
            .netlify
            !.netlify/plugins
            netlify/functions
            !netlify/functions/**/*.test.ts

  deploy:
    name: deploy a Netlify
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # netlify-cli fijado por lockfile (#73), de una versión confiable del Guardián; se instala fuera del proyecto.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ (job.workflow_repository == github.repository && github.event.pull_request.base.sha) || job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: tools/netlify
          path: .guardian
      - run: mv .guardian/tools/netlify "$RUNNER_TEMP/netlify" && rm -rf .guardian && npm ci --prefix "$RUNNER_TEMP/netlify"
      # Migraciones del proyecto (ADR 0029) antes de publicar: el SQL de db/migraciones/ y la herramienta de esta
      # versión del Guardián; la conexión sale de los secretos del Environment `staging`. No corre código del proyecto.
      - if: inputs.base_de_datos == 'mysql' && github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: db/migraciones
          path: .proyecto-db
      - if: inputs.base_de_datos == 'mysql' && github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ (job.workflow_repository == github.repository && github.event.pull_request.base.sha) || job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/db
            scripts/migraciones.ts
          path: .guardian-db
      - if: inputs.base_de_datos == 'mysql' && github.event_name == 'push'
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_SSL: ${{ vars.MYSQL_SSL || '1' }}
        run: |
          if ! ls .proyecto-db/db/migraciones/*.sql >/dev/null 2>&1; then
            echo "Sin migraciones todavía: no hace falta la conexión."; rm -rf .guardian-db .proyecto-db; exit 0
          fi
          if [ -z "$MYSQL_HOST" ]; then
            echo "::error::Faltan los secretos MYSQL_* del Environment staging (Settings → Environments → staging)."; exit 1
          fi
          npm ci --prefix .guardian-db/tools/db --ignore-scripts
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .guardian-db/tools/db/migrar.ts .proyecto-db/db/migraciones
          rm -rf .guardian-db .proyecto-db
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sitio
      - id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          ALIAS: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'staging' }}
          SHA: ${{ github.sha }}
        run: |
          "$RUNNER_TEMP/netlify/node_modules/.bin/netlify" deploy --no-build --dir .netlify/static --alias "$ALIAS" \
            --message "$ALIAS $SHA" --json > deploy.json
          jq . deploy.json
          echo "url=$(jq -r .deploy_url deploy.json)" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment ${{ github.event.number }} --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "**Preview:** $URL (commit \`${SHA::7}\`)"
