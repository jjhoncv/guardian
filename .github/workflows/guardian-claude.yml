# Guardián · Claude reutilizable (ADR 0024):
# - «@claude» del dueño en un ticket (o en un PR, para pedir ajustes) → Claude desarrolla en la nube siguiendo el
#   CLAUDE.md del proyecto (pruebas primero) y abre el PR con «Closes #N».
# - Al fusionar un PR en main → si hay menos de 2 PRs de Claude esperando revisión, toma solo el siguiente
#   ticket de la fase actual. Al cerrar el dueño una fase, se relanza como workflow_dispatch y toma el primero
#   de la siguiente (el llamador necesita workflow_dispatch y actions: write).
# Claude no puede aprobar ni fusionar: main exige la aprobación del dueño.
name: Guardián · Claude

on:
  workflow_call:
    inputs:
      base_de_datos:
        description: "«mysql» le da a Claude un MySQL 8 temporal con las migraciones aplicadas, como el CI (ADR 0029)"
        type: string
        default: ""
    # Uno de los dos (ADR 0030): el token de la suscripción del dueño (claude setup-token) o una API key con tope.
    # Si están los dos, manda la suscripción.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      # Opcional: token clásico con permiso «project» para mover la tarjeta del ticket a «En curso».
      PROJECT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  claude:
    name: claude
    # Solo un @claude escrito por el dueño del repo: nadie más gasta la llave aunque el repo sea público.
    if: >-
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    services:
      mysql:
        image: ${{ inputs.base_de_datos == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MYSQL_HOST: ${{ inputs.base_de_datos == 'mysql' && '127.0.0.1' || '' }}
      MYSQL_PORT: ${{ inputs.base_de_datos == 'mysql' && '3306' || '' }}
      MYSQL_USER: ${{ inputs.base_de_datos == 'mysql' && 'root' || '' }}
      MYSQL_PASSWORD: ${{ inputs.base_de_datos == 'mysql' && 'ci' || '' }}
      MYSQL_DATABASE: ${{ inputs.base_de_datos == 'mysql' && 'ci' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # En un PR, la rama del PR: así npm ci instala sus dependencias y no las de main.
          ref: ${{ github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || '' }}
          fetch-depth: 1
          # Sin el GITHUB_TOKEN en git: así Claude empuja con el token de la App y sus commits disparan CI.
          persist-credentials: false
      # Entorno del proyecto para que Claude corra lint, pruebas y escenarios antes de abrir el PR.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Base temporal para que Claude pruebe contra MySQL: la herramienta de migraciones de esta versión del Guardián,
      # fuera del repo (en /tmp) para que no termine en un commit.
      - if: inputs.base_de_datos == 'mysql'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/db
            scripts/migraciones.ts
          path: .guardian-db
      - if: inputs.base_de_datos == 'mysql'
        run: |
          mv .guardian-db /tmp/guardian-db
          npm ci --prefix /tmp/guardian-db/tools/db --ignore-scripts
          node /tmp/guardian-db/tools/db/migrar.ts db/migraciones
      - uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          trigger_phrase: "@claude"
          include_comments_by_actor: ${{ github.repository_owner }}
          branch_prefix: "feat/"
          additional_permissions: |
            actions: read
          # Sonnet 5.5, tope de turnos y solo las herramientas necesarias (ADR 0024).
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 120
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm ci:*),Bash(git mv:*),Bash(git rm:*),Bash(npm install --ignore-scripts:*),Bash(npm run:*),Bash(npm test:*),Bash(npx bddgen:*),Bash(npx playwright:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr view:*),Bash(node /tmp/guardian-db/tools/db/migrar.ts:*)"
            --append-system-prompt "Si te activaron en un issue y subiste cambios a una rama, abre tú el PR con gh pr create: título feat(#N): … y el cuerpo en dos niveles según .github/pull_request_template.md (Closes #N; En simple: qué cambia para el usuario, diagrama si hay un flujo, cómo probarlo, qué necesitas del dueño; y el Detalle técnico plegado). No dejes solo un enlace para crearlo. Si cambias el código de un PR, actualiza su descripción con gh pr edit. Para agregar una dependencia usa npm install --ignore-scripts --save-exact <paquete> (sin scripts de instalación) y explica en el PR por qué hace falta. Para preparar el commit usa git add -A (no nombres rutas con paréntesis como app/(sitio), el control de permisos las bloquea). Si el proyecto usa MySQL, tienes una base temporal con las migraciones aplicadas; para aplicar una nueva: node /tmp/guardian-db/tools/db/migrar.ts db/migraciones."

  # Al cerrar el dueño una fase (milestone), la acción de Claude no acepta ese evento («Unsupported event type:
  # milestone», #279): se relanza este mismo workflow como workflow_dispatch, que sí acepta, y ahí se elige el ticket.
  relanzar:
    name: relanzar para la fase siguiente
    if: github.event_name == 'milestone' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_WORKFLOW_REF es el del llamador del proyecto: dueño/repo/.github/workflows/claude.yml@refs/...
          archivo=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          if ! gh workflow run "$archivo" -R "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"; then
            echo "::error::No pude relanzar $archivo. Su llamador necesita «workflow_dispatch:» en «on:» y «actions: write» en «permissions:» (Guardián #279)."
            exit 1
          fi

  # Siguiente tarea sola: al fusionar un PR, o al relanzarse tras cerrar el dueño una fase, elige el ticket con el
  # script de esta versión del Guardián. Al cerrar una fase, la fase actual pasa a ser la siguiente (#204).
  elegir:
    name: siguiente ticket
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      ticket: ${{ steps.elegir.outputs.ticket }}
    steps:
      # Si el PR traía el plan, «Tickets del plan» corre a la vez: espera a que cree los tickets (#200).
      - name: esperar los tickets del plan
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          gh api "repos/$REPO/pulls/$PR/files" --paginate -q '.[].filename' | grep -qx 'plan/tareas.json' || exit 0
          for _ in $(seq 1 30); do
            estado=$(gh run list -R "$REPO" --workflow tickets.yml --commit "$SHA" --json status -q '.[0].status')
            [ "$estado" = completed ] && exit 0
            sleep 10
          done
          echo "::warning::«Tickets del plan» no terminó en 5 minutos; elijo con los tickets que hay."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
          path: .guardian
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: elegir
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .guardian/scripts/siguiente-ticket.ts

  siguiente:
    name: claude (siguiente ticket)
    needs: elegir
    if: needs.elegir.outputs.ticket != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    services:
      mysql:
        image: ${{ inputs.base_de_datos == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MYSQL_HOST: ${{ inputs.base_de_datos == 'mysql' && '127.0.0.1' || '' }}
      MYSQL_PORT: ${{ inputs.base_de_datos == 'mysql' && '3306' || '' }}
      MYSQL_USER: ${{ inputs.base_de_datos == 'mysql' && 'root' || '' }}
      MYSQL_PASSWORD: ${{ inputs.base_de_datos == 'mysql' && 'ci' || '' }}
      MYSQL_DATABASE: ${{ inputs.base_de_datos == 'mysql' && 'ci' || '' }}
    steps:
      # El dueño ve que Claude empezó: comentario con el link al run, etiqueta en-curso y, con PROJECT_TOKEN, la tarjeta en «En curso».
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/en-curso.ts
          path: .guardian-en-curso
      - env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          TICKET: ${{ needs.elegir.outputs.ticket }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create en-curso --repo "$GITHUB_REPOSITORY" --color FBCA04 --description "Claude está trabajando en este ticket" 2>/dev/null || true
          gh issue edit "$TICKET" --repo "$GITHUB_REPOSITORY" --add-label en-curso
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .guardian-en-curso/scripts/en-curso.ts "$TICKET" "$RUN" > /tmp/en-curso.md
          gh issue comment "$TICKET" --repo "$GITHUB_REPOSITORY" --body-file /tmp/en-curso.md
          rm -rf .guardian-en-curso
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Base temporal para que Claude pruebe contra MySQL: la herramienta de migraciones de esta versión del Guardián,
      # fuera del repo (en /tmp) para que no termine en un commit.
      - if: inputs.base_de_datos == 'mysql'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/db
            scripts/migraciones.ts
          path: .guardian-db
      - if: inputs.base_de_datos == 'mysql'
        run: |
          mv .guardian-db /tmp/guardian-db
          npm ci --prefix /tmp/guardian-db/tools/db --ignore-scripts
          node /tmp/guardian-db/tools/db/migrar.ts db/migraciones
      - id: claude
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          branch_prefix: "feat/"
          prompt: |
            Desarrolla el ticket #${{ needs.elegir.outputs.ticket }} de este repo, siguiendo CLAUDE.md:
            1. Léelo con `gh issue view ${{ needs.elegir.outputs.ticket }}` (escenario BDD, qué se hace, criterio de hecho).
            2. Crea la rama `feat/${{ needs.elegir.outputs.ticket }}-<slug>` desde main.
            3. Pruebas primero; implementa lo mínimo para poner su escenario en verde. Corre `npm run lint`, `npm run typecheck`, `npm test`, `npm run build` y `npm run e2e`.
            4. Un solo cambio lógico, idealmente menos de 300 líneas.
            5. Abre el PR con `gh pr create`: título `feat(#${{ needs.elegir.outputs.ticket }}): …` y el cuerpo en dos niveles según `.github/pull_request_template.md`: `Closes #${{ needs.elegir.outputs.ticket }}`; **En simple** (qué cambia para el usuario, diagrama si hay un flujo, cómo probarlo en el preview, qué necesitas del dueño, escenarios en verde) y el **Detalle técnico** plegado.
            Para agregar una dependencia usa `npm install --ignore-scripts --save-exact <paquete>` y explica en el PR por qué hace falta. Para preparar el commit usa `git add -A` (no nombres rutas con paréntesis como `app/(sitio)`: el control de permisos las bloquea).
            Si el ticket necesita algo del dueño (cuentas, credenciales, decisiones) que no está, no lo inventes: comenta en el ticket qué falta y termina sin PR.
            Si el proyecto usa MySQL (hay `db/migraciones/`), tienes una base temporal con las migraciones ya aplicadas (variables MYSQL_*); para aplicar una migración nueva: `node /tmp/guardian-db/tools/db/migrar.ts db/migraciones`.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 120
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm ci:*),Bash(git mv:*),Bash(git rm:*),Bash(npm install --ignore-scripts:*),Bash(npm run:*),Bash(npm test:*),Bash(npx bddgen:*),Bash(npx playwright:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr view:*),Bash(node /tmp/guardian-db/tools/db/migrar.ts:*)"
      # Si Claude terminó sin PR o con error, el motivo queda en el ticket (comandos negados, límite de uso…).
      - if: always() && steps.claude.outcome != 'skipped'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/informe-claude.ts
            scripts/en-curso.ts
          path: .guardian-informe
      - if: always() && steps.claude.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          TICKET: ${{ needs.elegir.outputs.ticket }}
        run: |
          salida="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$salida" ] || { echo "Sin salida de Claude."; exit 0; }
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search "head:feat/$TICKET-" --json number -q 'length')
          [ "$prs" -gt 0 ] && hay=si || hay=no
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .guardian-informe/scripts/informe-claude.ts "$salida" "$TICKET" "$hay" > /tmp/informe.md
          if [ -s /tmp/informe.md ]; then
            gh issue comment "$TICKET" --repo "$GITHUB_REPOSITORY" --body-file /tmp/informe.md
          fi
      # Claude terminó: fuera la etiqueta y, con PROJECT_TOKEN, la tarjeta a «En revisión» (abrió PR) o de vuelta a «Por hacer».
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          TICKET: ${{ needs.elegir.outputs.ticket }}
        run: |
          gh issue edit "$TICKET" --repo "$GITHUB_REPOSITORY" --remove-label en-curso || true
          [ -f .guardian-informe/scripts/en-curso.ts ] || exit 0
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search "head:feat/$TICKET-" --json number -q 'length' || echo 0)
          [ "$prs" -gt 0 ] && hay=si || hay=no
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .guardian-informe/scripts/en-curso.ts --terminar "$TICKET" "$hay"
