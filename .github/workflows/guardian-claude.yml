# Guardián · Claude reutilizable (ADR 0024):
# - «@claude» del dueño en un ticket (o en un PR, para pedir ajustes) → Claude desarrolla en la nube siguiendo el
#   CLAUDE.md del proyecto (pruebas primero) y abre el PR con «Closes #N».
# - Al fusionar un PR en main → si hay menos de 2 PRs de Claude esperando revisión, toma solo el siguiente
#   ticket de la fase actual.
# Claude no puede aprobar ni fusionar: main exige la aprobación del dueño.
name: Guardián · Claude

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  claude:
    name: claude
    # Solo un @claude escrito por el dueño del repo: nadie más gasta la llave aunque el repo sea público.
    if: >-
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Sin el GITHUB_TOKEN en git: así Claude empuja con el token de la App y sus commits disparan CI.
          persist-credentials: false
      # Entorno del proyecto para que Claude corra lint, pruebas y escenarios antes de abrir el PR.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: anthropics/claude-code-action@86d88e619d8e6caf07b5c3944dd14f441c533718 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          include_comments_by_actor: ${{ github.repository_owner }}
          branch_prefix: "feat/"
          additional_permissions: |
            actions: read
          # Sonnet 5.5, tope de turnos y solo las herramientas necesarias (ADR 0024).
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm ci),Bash(npm run:*),Bash(npm test:*),Bash(npx bddgen:*),Bash(npx playwright:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr view:*)"
            --append-system-prompt "Si te activaron en un issue y subiste cambios a una rama, abre tú el PR con gh pr create: título feat(#N): … y el cuerpo en dos niveles según .github/pull_request_template.md (Closes #N; En simple: qué cambia para el usuario, diagrama si hay un flujo, cómo probarlo, qué necesitas del dueño; y el Detalle técnico plegado). No dejes solo un enlace para crearlo. Si cambias el código de un PR, actualiza su descripción con gh pr edit."

  # Siguiente tarea sola: al fusionar un PR, elige el ticket con el script de esta versión del Guardián.
  elegir:
    name: siguiente ticket
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      ticket: ${{ steps.elegir.outputs.ticket }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
          path: .guardian
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: elegir
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .guardian/scripts/siguiente-ticket.ts

  siguiente:
    name: claude (siguiente ticket)
    needs: elegir
    if: needs.elegir.outputs.ticket != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: anthropics/claude-code-action@86d88e619d8e6caf07b5c3944dd14f441c533718 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          branch_prefix: "feat/"
          prompt: |
            Desarrolla el ticket #${{ needs.elegir.outputs.ticket }} de este repo, siguiendo CLAUDE.md:
            1. Léelo con `gh issue view ${{ needs.elegir.outputs.ticket }}` (escenario BDD, qué se hace, criterio de hecho).
            2. Crea la rama `feat/${{ needs.elegir.outputs.ticket }}-<slug>` desde main.
            3. Pruebas primero; implementa lo mínimo para poner su escenario en verde. Corre `npm run lint`, `npm run typecheck`, `npm test`, `npm run build` y `npm run e2e`.
            4. Un solo cambio lógico, idealmente menos de 300 líneas.
            5. Abre el PR con `gh pr create`: título `feat(#${{ needs.elegir.outputs.ticket }}): …` y el cuerpo en dos niveles según `.github/pull_request_template.md`: `Closes #${{ needs.elegir.outputs.ticket }}`; **En simple** (qué cambia para el usuario, diagrama si hay un flujo, cómo probarlo en el preview, qué necesitas del dueño, escenarios en verde) y el **Detalle técnico** plegado.
            Si el ticket necesita algo del dueño (cuentas, credenciales, decisiones) que no está, no lo inventes: comenta en el ticket qué falta y termina sin PR.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm ci),Bash(npm run:*),Bash(npm test:*),Bash(npx bddgen:*),Bash(npx playwright:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr view:*)"
