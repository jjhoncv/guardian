# Guardián · Chequeo del PR reutilizable (reglas 1 y 3): ticket con escenario (bloquea), tamaño (avisa)
# y, si el PR trae plan/tareas.json, que el plan sea válido (bloquea).
name: Guardián · Chequeo del PR

on:
  workflow_call:

permissions:
  contents: read

jobs:
  chequeo:
    name: ticket y escenario
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # Los scripts salen de una versión confiable del Guardián: un PR no puede debilitar su propio chequeo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ (job.workflow_repository == github.repository && github.event.pull_request.base.sha) || job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
          path: .guardian
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .guardian/scripts/chequeo-pr.ts
      # El plan del PR es solo datos: se valida con el script confiable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: plan
          path: proyecto
      - run: |
          if [ -f proyecto/plan/tareas.json ]; then
            node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .guardian/scripts/crear-tickets.ts proyecto/plan/tareas.json --validar
          else
            echo "El PR no trae plan/tareas.json."
          fi
