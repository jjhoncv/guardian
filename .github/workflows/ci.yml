# CI del propio Guardián: usa su workflow reutilizable local (prueba su propio HEAD).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/guardian-ci.yml
