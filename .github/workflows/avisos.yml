# Avisos del Guardián al celular del dueño por Telegram (Fase 5). Un solo bot para todos los proyectos.
name: Avisos

on:
  schedule:
    - cron: "0 17 * * 1-5" # resumen diario: 12:00 en Lima, de lunes a viernes
  workflow_dispatch:
    inputs:
      aviso:
        description: Aviso a enviar
        type: choice
        options: [resumen, prueba]
        default: resumen
  # Los PRs que tocan los avisos mandan un mensaje de prueba (solo PRs del propio repo: los forks no reciben secretos).
  pull_request:
    paths:
      - scripts/telegram.ts
      - scripts/grafico.ts
      - tools/avisos/**
      - scripts/resumen.ts
      - scripts/proyectos.ts
      - .github/workflows/avisos.yml

permissions:
  contents: read

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisos:
    name: avisos por Telegram
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --prefix tools/avisos --ignore-scripts
      # El resumen sale en el horario, a mano y en los PRs que tocan los avisos (marcado como prueba).
      - name: Aviso
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          DUENO: ${{ github.repository_owner }}
          AVISO: ${{ github.event_name == 'workflow_dispatch' && inputs.aviso || 'resumen' }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR" ]; then export PRUEBA="Prueba del PR #$PR: así te llegará el resumen"; fi
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON tools/avisos/avisos.ts "$AVISO"
