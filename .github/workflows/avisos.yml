# Avisos del Guardián al celular del dueño por Telegram (Fase 5). Un solo bot para todos los proyectos.
name: Avisos

on:
  workflow_dispatch:
    inputs:
      aviso:
        description: Aviso a enviar
        type: choice
        options: [prueba]
        default: prueba
  # Los PRs que tocan los avisos mandan un mensaje de prueba (solo PRs del propio repo: los forks no reciben secretos).
  pull_request:
    paths:
      - scripts/telegram.ts
      - .github/workflows/avisos.yml

permissions:
  contents: read

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisos:
    name: avisos por Telegram
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Prueba de conexión
        if: github.event_name == 'pull_request' || inputs.aviso == 'prueba'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/telegram.ts "🛡️ <b>Guardián conectado</b> · los avisos de la Fase 5 llegarán aquí.${{ github.event_name == 'pull_request' && format(' (prueba del PR #{0})', github.event.pull_request.number) || '' }}"
