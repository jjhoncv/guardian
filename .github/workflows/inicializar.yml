# Una sola vez, en un repo creado desde la plantilla: deja el alcance, las instrucciones y el README
# propios y borra la historia del Guardián (ADR 0016). En la plantilla misma no hace nada.
name: Inicializar proyecto

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inicializar:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: marca
        run: echo "pendiente=$([ -f docs/PROYECTO.ejemplo.md ] && echo si || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.marca.outputs.pendiente == 'si'
        env:
          REPO: ${{ github.repository }}
        run: |
          scripts/inicializar-proyecto.sh "$REPO"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: inicializa el proyecto desde la plantilla Guardián"
          git push
