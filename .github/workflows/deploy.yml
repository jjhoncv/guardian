# Preview por PR y staging en cada push a main, en un solo sitio de Netlify (ADR 0008).
# El build (código del PR) corre sin secretos; el deploy usa el token y no ejecuta código del repo.
name: Deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Los PRs de forks y de Dependabot no tienen acceso a los secretos.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    uses: ./.github/workflows/build-netlify.yml

  deploy:
    name: deploy a Netlify
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sitio
      - id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          ALIAS: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'staging' }}
          SHA: ${{ github.sha }}
        run: |
          npx -y netlify-cli@27.10.2 deploy --no-build --dir .netlify/static --alias "$ALIAS" \
            --message "$ALIAS $SHA" --json > deploy.json
          jq . deploy.json
          echo "url=$(jq -r .deploy_url deploy.json)" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment ${{ github.event.number }} --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "**Preview:** $URL (commit \`${SHA::7}\`)"
