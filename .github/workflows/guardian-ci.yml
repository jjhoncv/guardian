# Guardián · CI reutilizable: lint, typecheck, pruebas, build, escenarios BDD en Chrome y % de avance.
# Lo llaman los proyectos (uses: jjhoncv/guardian/.github/workflows/guardian-ci.yml@vX.Y.Z) y el propio Guardián.
name: Guardián · CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  calidad:
    name: lint, typecheck, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-trazas
          path: test-results/
          retention-days: 7
      # % de escenarios del alcance en verde (ADR 0018), con el script de esta versión del Guardián.
      - if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
          path: .guardian
      - if: always()
        run: |
          if [ -f test-results/resultados.json ]; then
            node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .guardian/scripts/avance.ts test-results/resultados.json
          else
            echo "Sin reporte de escenarios."
          fi
