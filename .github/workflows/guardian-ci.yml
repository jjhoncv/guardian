# Guardián · CI reutilizable: lint, typecheck, pruebas, build, escenarios BDD en Chrome y % de avance.
# Lo llaman los proyectos (uses: jjhoncv/guardian/.github/workflows/guardian-ci.yml@vX.Y.Z) y el propio Guardián.
name: Guardián · CI

on:
  workflow_call:
    inputs:
      base_de_datos:
        description: "«mysql» levanta un MySQL 8 temporal, aplica db/migraciones/ y deja MYSQL_* para las pruebas (ADR 0029)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  calidad:
    name: lint, typecheck, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Base temporal solo para este run: se borra al terminar, con datos inventados (ADR 0029).
    services:
      mysql:
        image: ${{ inputs.base_de_datos == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MYSQL_HOST: ${{ inputs.base_de_datos == 'mysql' && '127.0.0.1' || '' }}
      MYSQL_PORT: ${{ inputs.base_de_datos == 'mysql' && '3306' || '' }}
      MYSQL_USER: ${{ inputs.base_de_datos == 'mysql' && 'root' || '' }}
      MYSQL_PASSWORD: ${{ inputs.base_de_datos == 'mysql' && 'ci' || '' }}
      MYSQL_DATABASE: ${{ inputs.base_de_datos == 'mysql' && 'ci' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Migraciones con la herramienta de esta versión del Guardián, antes de cualquier prueba.
      - if: inputs.base_de_datos == 'mysql'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/db
            scripts/migraciones.ts
          path: .guardian-db
      - if: inputs.base_de_datos == 'mysql'
        run: |
          npm ci --prefix .guardian-db/tools/db --ignore-scripts
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .guardian-db/tools/db/migrar.ts db/migraciones
          rm -rf .guardian-db
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-trazas
          path: test-results/
          retention-days: 7
      # % de escenarios del alcance en verde (ADR 0018), con el script de esta versión del Guardián.
      - if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
          path: .guardian
      - if: always()
        run: |
          if [ -f test-results/resultados.json ]; then
            node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .guardian/scripts/avance.ts test-results/resultados.json
          else
            echo "Sin reporte de escenarios."
          fi
      # El workflow de estado (ADR 0026) toma el avance de main de aquí, sin ejecutar código del proyecto.
      - if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('test-results/avance.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avance
          path: test-results/avance.json
          retention-days: 7
