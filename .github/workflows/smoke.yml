# Smoke test de producción (sección 8): los escenarios @smoke contra la URL publicada.
# Si fallan: rollback al deploy de producción anterior en Netlify y un issue de alerta (D4).
# Manual (Actions → Smoke test). El smoke de cada release vive en guardian-release.yml.
name: Smoke test

on:
  workflow_dispatch:
    inputs:
      url: { description: "URL a probar (p. ej. la de producción)", type: string, required: true }
      rollback: { description: "Si falla, volver al deploy de producción anterior", type: boolean, default: false }

permissions:
  contents: read

jobs:
  smoke:
    name: smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - env:
          BASE_URL: ${{ inputs.url }}
        run: npx bddgen && npx playwright test --grep @smoke --retries=2

  rollback:
    name: rollback y alerta
    needs: smoke
    if: failure() && inputs.rollback
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Este job tiene el token de Netlify: solo baja tools/netlify (lockfile), no el código del repo.
      # netlify-cli fijado por lockfile (#73), tomado de main: un PR no puede cambiar lo que corre con el token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            tools/netlify
          path: herramientas
      - run: npm ci --prefix herramientas/tools/netlify
      - env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_BIN: herramientas/tools/netlify/node_modules/.bin/netlify
          SITIO: ${{ vars.NETLIFY_SITE_ID }}
          URL: ${{ inputs.url }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: herramientas/scripts/rollback.sh
