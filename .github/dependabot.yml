version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      dependencias:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Saltos mayores que rompen la base: ESLint los adopta eslint-config-next primero;
      # @types/node sigue la versión de Node del proyecto (.nvmrc).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      acciones:
        patterns: ["*"]
