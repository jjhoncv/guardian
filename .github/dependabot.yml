version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      dependencias:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Los saltos mayores (TypeScript 7, ESLint 10, @types/node de otra versión de Node...) rompen
      # la base: se actualizan como tarea consciente, con su issue y sus pruebas. Los parches de
      # seguridad llegan igual (Dependabot security updates).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # netlify-cli del CI (#73): mismas reglas que el resto de npm.
  - package-ecosystem: npm
    directory: /tools/netlify
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      netlify-cli:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # mysql2 de las migraciones (ADR 0029): mismas reglas.
  - package-ecosystem: npm
    directory: /tools/db
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      db:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      acciones:
        patterns: ["*"]
