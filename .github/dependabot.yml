version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      dependencias:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      acciones:
        patterns: ["*"]
